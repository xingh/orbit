[package]
name = "orbit-companion"
version = "0.1.0"
description = "A local desktop robot launcher for AI chats and projects"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
open = "5"
rfd = "0.15"
url = "2"
